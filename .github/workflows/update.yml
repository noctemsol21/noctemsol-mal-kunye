name: Update MAL künye

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check connectivity to public APIs
        run: |
          for url in \
            https://api.github.com \
            https://api.jikan.moe/v4 \
            https://jikan.lucashdo.com/v1/users/noctemsol/animelist?page=1 \
            'https://myanimelist.net/animelist/noctemsol/load.json?status=7&offset=0'; do
            echo "Testing $url"
            curl -4 -sS -o /dev/null -w 'HTTP %{http_code}; IP %{remote_ip}\n' --connect-timeout 7 --max-time 10 "$url" || true
          done
      - name: Inspect alternative API response shape
        run: |
          for url in \
            'https://jikan.lucashdo.com/v1/users/noctemsol/animelist?page=1&limit=1' \
            'https://jikan.lucashdo.com/v1/anime/5114' \
            'https://jikan.lucashdo.com/v1/manga/2'; do
            echo "SAMPLE $url"
            curl -4 -sS -L --max-time 15 "$url" | head -c 4200 || true
            echo
          done
      - name: Update public MAL metadata
        run: python scripts/generate.py
        env:
          MAL_USERNAME: noctemsol
          MAX_DETAILS: '1200'
      - name: Keep metadata cached for the next run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/kunye.css docs/cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Update MAL künye data"
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish CSS on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
