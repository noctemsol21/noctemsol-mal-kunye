name: Update MAL künye

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update public MAL metadata
        run: python scripts/generate.py
        env:
          MAL_USERNAME: noctemsol
          MAX_DETAILS: '1200'
      - name: Keep metadata cached for the next run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/kunye.css docs/cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Update MAL künye data"
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish CSS on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
